<app-navbar />
<main class="main-content">
  <router-outlet />
</main>

@if (auth.mostrarModalSesion()) {
  <div class="modal-overlay-sesion">
    <div class="glass-card modal-sesion-contenido">
      <span class="material-symbols-outlined modal-sesion-icono">timer</span>
      <h3 class="modal-sesion-titulo">SESIÓN POR EXPIRAR</h3>
      <p class="modal-sesion-msg">Queda 1 minuto de sesión [MODO TESTEO]. ¿Desea extenderla?</p>
      <div class="modal-sesion-botones">
        <button class="btn-pink" (click)="rechazarExtension()">Cerrar sesión</button>
        <button class="btn-primary" (click)="extenderSesion()">Extender</button>
      </div>
    </div>
  </div>
}
